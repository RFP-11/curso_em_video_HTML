<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições</title>
    <style>
        body {
            background-color: black;
            color: white
        }
    </style>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do carro: <input type="number" name="txtVelocidade" id="txtVelocidade"> Km/h
    <input type="button" value="Verificar" onclick="Clicar()">
    <div id="resposta"></div>
    <script>
        function Clicar() {
            var vel = Number(document.getElementById('txtVelocidade').value)
            var resposta = document.getElementById('resposta')
            resposta.innerHTML = `<p>Sua velocidade é de <strong>${vel}Km/h</strong></p>`
            if (vel > 60) {
                resposta.innerHTML += `<p>Você foi <strong>MULTADO</strong> por excesso de velocidade</p>`
            }
            resposta.innerHTML += "<p>Dirija com segurança!</p>"
        }
    </script>
</body>
</html>
