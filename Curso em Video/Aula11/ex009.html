<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições</title>
    <style>
        body {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Nacionalidade</h1>
    Qual seu pais de origem? <input type="text" name="txtPais" id="txtPais">
    <input type="button" value="Selecionar" onclick="Clicar()">
    <h2 id="resultado"></h2>
    <script>
        function Clicar() {
            var pais = document.getElementById('txtPais').value
            var resposta = document.getElementById('resultado')
            if (pais == 'Brasil') {
                resposta.innerHTML = 'Você é Brasileiro!'
            } else {
                resposta.innerHTML = 'Você é Estrangeiro!'
            }
        }
    </script>
</body>
</html>
