<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body {
            background-color: rgb(71, 71, 253);
            color:white;  /*isso é um comentário em css*/
            font: normal 20pt Arial;
        }
        h1{color: black;}
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>  <!-- Isso é um comentário em html -->
    <p>Já me livrei da maldição.</p>
    <script>
        var n1 = prompt('Digite um número:')  // sempre recebe como string
        var n2 = prompt('Digite outro número:')  // string
        n1 = Number.parseInt(n1)
        n2 = Number.parseInt(n2)
        var s1 = n1 + n2
        alert('A soma dos números foi ' + s1) // concatenação
        // (number + number) para adição
        // (string + string) para concatenação
        alert(`A soma entre ${n1} e ${n2} é ${s1}`)  // Usando template string
    
        var n3 = Number(prompt('Digite um número:'))
        var n4 = Number(prompt('Digite outro número:'))
        var s2 = n3 + n4
        alert(`A soma entre ${n3} e ${n4} é ${s2}`)
    </script>
</body>
</html>
