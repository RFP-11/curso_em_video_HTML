<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
    <style>
        body {
            font: normal 18pt Arial;
            background: black;
            color: white
        }
        .container{
            width: 100%;
            margin-top: 40px;
            margin-left: 40px;
        }        
        .container_colorido{
            float: left;
            width: 750px;
            height: 225px;
            margin-left: 30px;
            border-radius: 40px;
            padding: 10px;
            background: gray;            
        }
        input {
            font: normal 18pt Arial;            
            padding: 2px 4px;
            border-radius: 10px;
            background: wheat;
        }
        div#res {
            margin-top: 20px;
            color: greenyellow;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container_colorido">
            <h1>Somando Valores</h1>
            <input type="number" name="txtn1" id="txtn1"> +
            <input type="number" name="txtn2" id="txtn2">
            <input type="button" value="Somar" onclick="somar()">
            <div id="res">Resultado</div>
        </div>
    </div>

    <script>
        function somar() {
            var tn1 = document.getElementById('txtn1')
            var tn2 = document.querySelector('input#txtn2')  //pode fazer também usando: getElementById('txtn2')
            var res = document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var s = n1 + n2
            res.innerHTML = `A soma entre ${n1} e ${n2} é igual a <strong>${s}</strong>`
        }
    </script>
</body>
</html>
